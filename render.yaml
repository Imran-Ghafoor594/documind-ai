# PAID resources: review docs/DEPLOYMENT.md before applying.
services:
  - type: web
    name: documind-api
    runtime: docker
    region: singapore
    plan: 1c-2g
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    disk:
      name: documind-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: documind-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: CORS_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_MODEL
        value: openai/gpt-oss-20b
      - key: AI_JSON_MODE
        value: "true"
      - key: AI_MAX_COMPLETION_TOKENS
        value: "4096"
      - key: AI_TIMEOUT_SECONDS
        value: "30"
      - key: AI_MAX_RETRIES
        value: "1"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: MAX_PDF_PAGES
        value: "5"
      - key: OCR_DPI
        value: "150"
      - key: OCR_TIMEOUT_SECONDS
        value: "20"
      - key: OCR_LANGUAGES
        value: eng
  - type: web
    name: documind-web
    runtime: static
    buildCommand: cd frontend && npm ci --no-audit --no-fund && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
databases:
  - name: documind-db
    region: singapore
    plan: 0.1c-256mb
    diskSizeGB: 1
    databaseName: documind
    user: documind
    ipAllowList: []
